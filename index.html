
<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OMR PRO - Lector OMR y QR</title>

<!-- ================= LIBRERÍAS ================= -->

<script src="https://docs.opencv.org/4.x/opencv.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 10px;
  background: #000;
  color: #fff;
  font-family: Arial, sans-serif;
  text-align: center;
}

h2 {
  font-size: clamp(20px, 4vw, 30px);
  margin: 12px 0;
}

#contenedor {
  position: relative;
  width: 100%;
  height: 45vh;
  min-height: 260px;
  max-height: 600px;
  overflow: hidden;
  background: #000;
  border: 1px solid #333;
}

video {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

#overlay {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

#canvas {
  display: none;
}

button {
  padding: 12px 18px;
  margin: 5px;
  font-size: 17px;
  font-weight: bold;
  border: 0;
  border-radius: 7px;
  cursor: pointer;
  color: #fff;
  background: #174ea6;
}

button:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

#btnEnviar {
  background: #087f45;
}

#btnReiniciar {
  background: #555;
}

#btnFlash {
  background: #805600;
}

#estado {
  margin: 12px 0;
  padding: 10px;
  font-size: 17px;
  overflow-wrap: anywhere;
  background: #151515;
  border-radius: 6px;
}

#resultado {
  margin: 15px auto;
  max-width: 800px;
  overflow-wrap: anywhere;
}

.respuesta {
  padding: 7px;
  margin: 5px 0;
  border-bottom: 1px solid #333;
  font-size: 20px;
}

.correcta {
  color: #00ff66;
}

.incorrecta {
  color: #ff4545;
}

.doble {
  color: #ffb347;
}

#notaFinal {
  font-size: clamp(32px, 8vw, 60px);
  color: #00ff88;
  font-weight: bold;
  margin: 15px;
}

#datosLectura {
  font-size: 15px;
  color: #ddd;
  overflow-wrap: anywhere;
}

</style>
</head>

<body>

<h2>📷 OMR PRO – Detección Real de Cuadros</h2>

<!-- ================= CÁMARA ================= -->

<div id="contenedor">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>
</div>

<canvas id="canvas"></canvas>

<div id="estado">Inicializando cámara y librerías...</div>

<div id="datosLectura"></div>

<!-- ================= BOTONES ================= -->

<div>
  <button id="btnProcesar" onclick="procesar()" disabled>
    📸 Procesar OMR + QR
  </button>

  <button id="btnEnviar" onclick="enviar()" disabled>
    📤 Enviar
  </button>

  <button id="btnReiniciar" onclick="reiniciar()">
    🔄 Reiniciar
  </button>

  <button id="btnFlash" onclick="toggleFlash()" disabled>
    🔦 Encender linterna
  </button>
</div>

<div id="resultado"></div>

<script>

/* ==========================================================
   CONFIGURACIÓN
========================================================== */

// URL de la aplicación web de Apps Script.
const URL_APPS_SCRIPT =
  "https://script.google.com/macros/s/AKfycbwvEKJ6OhNrFNAi-rZUwaD3grhiAUtqH-dt1dy6lRdhrCQuXSsuhRU77FGHj8PNvYRyBA/exec";

// Región de la imagen donde se buscan las burbujas.
// Ajustar según la ubicación real de la hoja impresa.
const AREA_OMR = {
  x: 0.01,
  y: 0.10,
  w: 0.99,
  h: 0.20
};

const UMBRAL_MARCADO = 70;
const DIFERENCIA_MIN = 26;
const TOTAL_PREGUNTAS = 10;
const LETRAS = ["A", "B", "C", "D"];

let respuestas = [];
let nota = 0;
let rudeQR = "";

let omrOK = false;
let qrOK = false;
let envioEnCurso = false;
let calculoEnCurso = false;

let videoTrack = null;
let flashEncendido = false;
let camaraLista = false;
let opencvLista = false;
let capturaActual = 0;

// Se asigna al recibir el detalle de la corrección.
let detalleCorreccion = [];

/* ==========================================================
   ELEMENTOS DOM
========================================================== */

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const overlay = document.getElementById("overlay");

const ctx = canvas.getContext("2d", {
  willReadFrequently: true
});

const ctxO = overlay.getContext("2d");

const estado = document.getElementById("estado");
const resultado = document.getElementById("resultado");

const btnProcesar = document.getElementById("btnProcesar");
const btnEnviar = document.getElementById("btnEnviar");
const btnFlash = document.getElementById("btnFlash");

/* ==========================================================
   INICIALIZACIÓN DE OPENCV
========================================================== */

function comprobarOpenCV() {
  if (
    typeof cv !== "undefined" &&
    cv.Mat &&
    cv.findContours
  ) {
    opencvLista = true;
    actualizarEstadoInicial();
    return;
  }

  setTimeout(comprobarOpenCV, 500);
}

comprobarOpenCV();

/* ==========================================================
   INICIALIZACIÓN DE CÁMARA
========================================================== */

async function iniciarCamara() {
  try {
    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {
      throw new Error(
        "La cámara requiere HTTPS y un navegador compatible."
      );
    }

    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: "environment" },
        width: { ideal: 1920 },
        height: { ideal: 1080 },
        frameRate: { ideal: 30 }
      },
      audio: false
    });

    video.srcObject = stream;
    videoTrack = stream.getVideoTracks()[0];

    await new Promise((resolve, reject) => {
      if (video.readyState >= 1) {
        resolve();
        return;
      }

      video.onloadedmetadata = resolve;
      video.onerror = () =>
        reject(new Error("No se pudo iniciar el video."));
    });

    await video.play();

    camaraLista = true;

    const settings = videoTrack.getSettings();

    document.getElementById("datosLectura").textContent =
      "Cámara: " +
      (settings.width || "?") +
      " × " +
      (settings.height || "?");

    const capabilities =
      videoTrack.getCapabilities
        ? videoTrack.getCapabilities()
        : {};

    btnFlash.disabled = !capabilities.torch;

    if (!capabilities.torch) {
      btnFlash.textContent = "🚫 Sin linterna";
    }

    actualizarEstadoInicial();

  } catch (error) {
    console.error("Error de cámara:", error);

    estado.textContent =
      "❌ No se pudo iniciar la cámara: " +
      error.message +
      ". Verifica los permisos del navegador.";
  }
}

iniciarCamara();

/* ==========================================================
   ESTADO INICIAL
========================================================== */

function actualizarEstadoInicial() {
  if (camaraLista && opencvLista) {
    estado.textContent =
      "✅ Cámara y OpenCV listos. Coloca la hoja frente a la cámara.";

    btnProcesar.disabled = false;
  } else if (!camaraLista) {
    estado.textContent = "Inicializando cámara...";
  } else {
    estado.textContent = "Esperando a que OpenCV esté listo...";
  }
}

/* ==========================================================
   CONEXIÓN GITHUB PAGES ↔ APPS SCRIPT
========================================================== */

// Comunicación JSONP para evitar la dependencia de
// google.script.run en una página alojada en GitHub Pages.
//
// El servidor debe implementar el adaptador JSONP
// y validar los datos recibidos antes de escribir.

function llamarAPI(accion, datos) {
  return new Promise((resolve, reject) => {
    const callback =
      "omrCallback_" +
      Date.now() +
      "_" +
      Math.floor(Math.random() * 1000000);

    const script = document.createElement("script");

    let finalizado = false;

    const temporizador = setTimeout(() => {
      finalizar();

      reject(new Error(
        "Tiempo de espera agotado. Verifica la implementación de Apps Script."
      ));
    }, 30000);

    function finalizar() {
      if (finalizado) return;

      finalizado = true;

      clearTimeout(temporizador);

      try {
        delete window[callback];
      } catch (_) {
        window[callback] = undefined;
      }

      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }
    }

    window[callback] = function(respuesta) {
      if (finalizado) return;

      finalizar();
      resolve(respuesta);
    };

    script.onerror = function() {
      if (finalizado) return;

      finalizar();

      reject(new Error(
        "No se pudo conectar con Apps Script. Comprueba la URL, los permisos y el despliegue."
      ));
    };

    const parametros = new URLSearchParams({
      action: accion,
      callback: callback,
      data: JSON.stringify(datos)
    });

    script.src =
      URL_APPS_SCRIPT + "?" + parametros.toString();

    document.head.appendChild(script);
  });
}

/* ==========================================================
   PROCESAR IMAGEN
========================================================== */

async function procesar() {
  if (!camaraLista || !opencvLista) {
    estado.textContent =
      "La cámara o OpenCV todavía no están listos.";
    return;
  }

  if (video.videoWidth === 0 || video.videoHeight === 0) {
    estado.textContent = "Esperando imagen de la cámara...";
    return;
  }

  btnProcesar.disabled = true;
  btnEnviar.disabled = true;

  respuestas = [];
  nota = 0;
  rudeQR = "";
  omrOK = false;
  qrOK = false;
  detalleCorreccion = [];

  resultado.innerHTML = "";
  estado.textContent = "Procesando imagen...";

  const idCaptura = ++capturaActual;

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  overlay.width = video.videoWidth;
  overlay.height = video.videoHeight;

  ctxO.clearRect(0, 0, overlay.width, overlay.height);
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  let src = null;
  let gray = null;
  let bin = null;

  try {
    src = cv.imread(canvas);
    gray = new cv.Mat();
    bin = new cv.Mat();

    cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);

    cv.GaussianBlur(
      gray,
      gray,
      new cv.Size(5, 5),
      0
    );

    cv.adaptiveThreshold(
      gray,
      bin,
      255,
      cv.ADAPTIVE_THRESH_GAUSSIAN_C,
      cv.THRESH_BINARY_INV,
      31,
      7
    );

    dibujarAreas();

    const omrDetectado = leerOMR(bin, gray);

    leerQRAutomatico();

    if (!omrDetectado) {
      omrOK = false;
      estado.textContent =
        "❌ No se pudo leer correctamente la hoja OMR.";
      return;
    }

    if (!qrOK) {
      estado.textContent =
        "⚠️ OMR leído, pero no se detectó el QR.";
      return;
    }

    if (idCaptura !== capturaActual) return;

    await calcularAntesDeGuardar();

  } catch (error) {
    console.error("Error OMR:", error);

    estado.textContent =
      "❌ Error durante el procesamiento: " +
      error.message;

  } finally {
    if (src) src.delete();
    if (gray) gray.delete();
    if (bin) bin.delete();

    btnProcesar.disabled = false;
  }
}

/* ==========================================================
   DIBUJAR ÁREA OMR
========================================================== */

function dibujarAreas() {
  const W = canvas.width;
  const H = canvas.height;

  ctxO.clearRect(0, 0, W, H);

  ctxO.strokeStyle = "red";
  ctxO.lineWidth = 3;

  ctxO.strokeRect(
    AREA_OMR.x * W,
    AREA_OMR.y * H,
    AREA_OMR.w * W,
    AREA_OMR.h * H
  );
}

/* ==========================================================
   LEER OMR
========================================================== */

function leerOMR(bin, gray) {
  const W = canvas.width;
  const H = canvas.height;

  const rx = Math.round(AREA_OMR.x * W);
  const ry = Math.round(AREA_OMR.y * H);
  const rw = Math.round(AREA_OMR.w * W);
  const rh = Math.round(AREA_OMR.h * H);

  let roiBin = null;
  let roiGray = null;
  let contours = null;
  let hierarchy = null;

  try {
    roiBin = bin.roi(
      new cv.Rect(rx, ry, rw, rh)
    );

    roiGray = gray.roi(
      new cv.Rect(rx, ry, rw, rh)
    );

    contours = new cv.MatVector();
    hierarchy = new cv.Mat();

    cv.findContours(
      roiBin,
      contours,
      hierarchy,
      cv.RETR_EXTERNAL,
      cv.CHAIN_APPROX_SIMPLE
    );

    const burbujas = [];

    for (let i = 0; i < contours.size(); i++) {
      const cnt = contours.get(i);

      try {
        const area = cv.contourArea(cnt);

        if (area < 300 || area > 3000) continue;

        const peri = cv.arcLength(cnt, true);

        if (peri === 0) continue;

        const circularidad =
          4 * Math.PI * area / (peri * peri);

        if (circularidad < 0.6) continue;

        const r = cv.boundingRect(cnt);

        burbujas.push({
          x: r.x,
          y: r.y,
          w: r.width,
          h: r.height
        });

      } finally {
        cnt.delete();
      }
    }

    if (burbujas.length < 30) {
      estado.textContent =
        "❌ Se detectaron pocas burbujas. Ajusta la posición, iluminación o región OMR.";
      return false;
    }

    // Ordenar por posición vertical.
    burbujas.sort((a, b) => a.y - b.y);

    // Agrupar contornos que pertenecen a la misma fila.
    const filas = [];
    const toleranciaY = 20;

    burbujas.forEach(b => {
      let filaEncontrada = null;

      for (const f of filas) {
        if (Math.abs(f[0].y - b.y) < toleranciaY) {
          filaEncontrada = f;
          break;
        }
      }

      if (filaEncontrada) {
        filaEncontrada.push(b);
      } else {
        filas.push([b]);
      }
    });

    filas.forEach(f => f.sort((a, b) => a.x - b.x));

    if (filas.length < 3) {
      estado.textContent =
        "❌ No se detectan las tres filas de respuestas.";
      return false;
    }

    // Esta lógica presupone 3 filas con 4 opciones por pregunta.
    // La distribución real debe coincidir con la hoja impresa.
    const matriz = filas.slice(0, 3);

    respuestas = [];
    nota = 0;

    let html = "";
    let pregunta = 0;

    const totalCols = Math.max(
      ...matriz.map(f => f.length)
    );

    for (
      let col = 0;
      col < totalCols && pregunta < TOTAL_PREGUNTAS;
      col += 4
    ) {
      for (
        let fila = 0;
        fila < 3 && pregunta < TOTAL_PREGUNTAS;
        fila++
      ) {
        const grupo = [];

        for (let k = 0; k < 4; k++) {
          if (matriz[fila][col + k]) {
            grupo.push(matriz[fila][col + k]);
          }
        }

        if (grupo.length < 4) continue;

        const valores = [];

        grupo.forEach((b, j) => {
          const region = roiGray.roi(
            new cv.Rect(b.x, b.y, b.w, b.h)
          );

          let media;

          try {
            media = cv.mean(region)[0];
          } finally {
            region.delete();
          }

          valores.push({
            indice: j,
            oscuridad: 255 - media
          });

          ctxO.strokeStyle = "red";
          ctxO.lineWidth = 3;

          ctxO.strokeRect(
            rx + b.x,
            ry + b.y,
            b.w,
            b.h
          );
        });

        valores.sort(
          (a, b) => b.oscuridad - a.oscuridad
        );

        const principal = valores[0];
        const segunda = valores[1];

        if (principal.oscuridad < UMBRAL_MARCADO) {
          respuestas.push("");

          html += `
            <div class="respuesta">
              P${pregunta + 1}: Sin respuesta
            </div>
          `;

        } else if (
          segunda &&
          segunda.oscuridad > UMBRAL_MARCADO &&
          Math.abs(
            principal.oscuridad - segunda.oscuridad
          ) < DIFERENCIA_MIN
        ) {
          respuestas.push("DOBLE");

          html += `
            <div class="respuesta doble">
              P${pregunta + 1}: DOBLE MARCACIÓN
            </div>
          `;

          [principal, segunda].forEach(obj => {
            const b = grupo[obj.indice];

            ctxO.fillStyle = "rgba(0,255,255,0.3)";
            ctxO.fillRect(
              rx + b.x,
              ry + b.y,
              b.w,
              b.h
            );

            ctxO.strokeStyle = "blue";
            ctxO.lineWidth = 4;

            ctxO.strokeRect(
              rx + b.x,
              ry + b.y,
              b.w,
              b.h
            );
          });

        } else {
          const resp = LETRAS[principal.indice];

          respuestas.push(resp);

          const b = grupo[principal.indice];

          ctxO.fillStyle = "rgba(0,255,0,0.35)";
          ctxO.fillRect(
            rx + b.x,
            ry + b.y,
            b.w,
            b.h
          );

          ctxO.strokeStyle = "lime";
          ctxO.lineWidth = 3;

          ctxO.strokeRect(
            rx + b.x,
            ry + b.y,
            b.w,
            b.h
          );

          html += `
            <div class="respuesta">
              P${pregunta + 1}: ${resp}
            </div>
          `;
        }

        pregunta++;
      }
    }

    if (respuestas.length !== TOTAL_PREGUNTAS) {
      estado.textContent =
        "❌ Se detectaron " + respuestas.length +
        " respuestas; se necesitan " + TOTAL_PREGUNTAS +
        ". Revisa la distribución de la hoja.";
      return false;
    }

    omrOK = true;

    resultado.innerHTML = html;

    estado.textContent =
      "✅ OMR leído. Buscando o validando el QR...";

    return true;

  } finally {
    if (roiBin) roiBin.delete();
    if (roiGray) roiGray.delete();
    if (contours) contours.delete();
    if (hierarchy) hierarchy.delete();
  }
}

/* ==========================================================
   LEER QR
========================================================== */

function leerQRAutomatico() {
  try {
    const W = canvas.width;
    const H = canvas.height;

    const img = ctx.getImageData(0, 0, W, H);

    const qr = jsQR(
      img.data,
      img.width,
      img.height,
      { inversionAttempts: "attemptBoth" }
    );

    if (!qr) {
      qrOK = false;
      rudeQR = "";
      return false;
    }

    rudeQR = String(qr.data || "").trim();

    if (!rudeQR) {
      qrOK = false;
      return false;
    }

    qrOK = true;

    const p = qr.location;

    ctxO.strokeStyle = "cyan";
    ctxO.lineWidth = 4;

    ctxO.beginPath();
    ctxO.moveTo(
      p.topLeftCorner.x,
      p.topLeftCorner.y
    );
    ctxO.lineTo(
      p.topRightCorner.x,
      p.topRightCorner.y
    );
    ctxO.lineTo(
      p.bottomRightCorner.x,
      p.bottomRightCorner.y
    );
    ctxO.lineTo(
      p.bottomLeftCorner.x,
      p.bottomLeftCorner.y
    );
    ctxO.closePath();
    ctxO.stroke();

    document.getElementById("datosLectura").textContent =
      "QR detectado: " + rudeQR;

    return true;

  } catch (error) {
    console.error("Error QR:", error);

    qrOK = false;
    rudeQR = "";

    return false;
  }
}

/* ==========================================================
   CALCULAR NOTA EN APPS SCRIPT
========================================================== */

async function calcularAntesDeGuardar() {
  if (calculoEnCurso || !omrOK || !qrOK) return;

  calculoEnCurso = true;
  btnEnviar.disabled = true;

  estado.textContent = "Calculando nota en Google Sheets...";

  try {
    const res = await llamarAPI("calcularOMR", {
      qr: rudeQR,
      respuestas: respuestas
    });

    if (!res || !res.success) {
      estado.textContent =
        res && res.mensaje
          ? res.mensaje
          : "No se pudo calcular la nota.";

      return;
    }

    nota = res.nota;
    detalleCorreccion = res.detalle || [];

    mostrarCorreccion(detalleCorreccion, nota);

    estado.textContent =
      "✅ Nota calculada. Revisa antes de enviar.";

    btnEnviar.disabled = false;

  } catch (error) {
    console.error(error);

    estado.textContent =
      "❌ Error al calcular: " + error.message;

  } finally {
    calculoEnCurso = false;
  }
}

/* ==========================================================
   ENVIAR NOTA
========================================================== */

async function enviar() {
  if (envioEnCurso) return;

  if (!omrOK || !qrOK || respuestas.length !== TOTAL_PREGUNTAS) {
    estado.textContent =
      "❌ Primero debes leer correctamente el OMR y el QR.";
    return;
  }

  envioEnCurso = true;
  btnEnviar.disabled = true;

  estado.textContent =
    "Enviando respuestas a Google Sheets...";

  try {
    const res = await llamarAPI("guardarOMR", {
      qr: rudeQR,
      respuestas: respuestas
    });

    if (!res || !res.success) {
      estado.textContent =
        res && res.mensaje
          ? res.mensaje
          : "No se pudo guardar la nota.";

      btnEnviar.disabled = false;
      return;
    }

    estado.textContent =
      res.mensaje || "✅ Operación completada.";

    if (res.detalle) {
      mostrarCorreccion(res.detalle, res.nota);
    }

  } catch (error) {
    console.error(error);

    estado.textContent =
      "❌ Error al enviar: " + error.message;

    btnEnviar.disabled = false;

  } finally {
    envioEnCurso = false;
  }
}

/* ==========================================================
   MOSTRAR CORRECCIÓN
========================================================== */

function mostrarCorreccion(detalle, notaFinal) {
  detalle = Array.isArray(detalle) ? detalle : [];

  let html = `
    <div id="notaFinal">
      NOTA FINAL: ${escaparHTML(notaFinal ?? "—")}
    </div>
    <hr>
  `;

  detalle.forEach((item, i) => {
    const alumno = escaparHTML(item.alumno ?? "—");
    const correcta = escaparHTML(item.correcta ?? "—");

    if (item.estado === "correcta") {
      html += `
        <div class="respuesta correcta">
          P${i + 1}: ${alumno} ✔
        </div>
      `;

    } else if (item.estado === "incorrecta") {
      html += `
        <div class="respuesta incorrecta">
          P${i + 1}: ${alumno} ✘
          <span style="color:yellow">
            (Correcta: ${correcta})
          </span>
        </div>
      `;

    } else if (item.estado === "doble") {
      html += `
        <div class="respuesta doble">
          P${i + 1}: DOBLE MARCACIÓN
          <span style="color:yellow">
            (Correcta: ${correcta})
          </span>
        </div>
      `;

    } else {
      html += `
        <div class="respuesta">
          P${i + 1}: Sin respuesta
          <span style="color:yellow">
            (Correcta: ${correcta})
          </span>
        </div>
      `;
    }
  });

  resultado.innerHTML = html;
}

/* ==========================================================
   ESCAPAR TEXTO
========================================================== */

function escaparHTML(valor) {
  return String(valor)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

/* ==========================================================
   REINICIAR
========================================================== */

function reiniciar() {
  if (envioEnCurso || calculoEnCurso) {
    estado.textContent =
      "Espera a que termine la operación actual.";
    return;
  }

  respuestas = [];
  nota = 0;
  rudeQR = "";

  omrOK = false;
  qrOK = false;

  detalleCorreccion = [];

  capturaActual++;

  btnEnviar.disabled = true;

  resultado.innerHTML = "";

  ctxO.clearRect(
    0,
    0,
    overlay.width,
    overlay.height
  );

  document.getElementById("datosLectura").textContent = "";

  estado.textContent =
    "Listo para nuevo escaneo. Coloca la siguiente hoja.";

  btnProcesar.disabled = !camaraLista || !opencvLista;
}

/* ==========================================================
   LINTERNA
========================================================== */

async function toggleFlash() {
  if (!videoTrack) {
    estado.textContent = "La cámara todavía no está lista.";
    return;
  }

  try {
    const capabilities = videoTrack.getCapabilities();

    if (!capabilities.torch) {
      estado.textContent =
        "Este dispositivo no soporta el control de linterna.";
      return;
    }

    flashEncendido = !flashEncendido;

    await videoTrack.applyConstraints({
      advanced: [{ torch: flashEncendido }]
    });

    btnFlash.textContent = flashEncendido
      ? "🔦 Apagar linterna"
      : "🔦 Encender linterna";

  } catch (error) {
    console.error(error);

    flashEncendido = false;

    estado.textContent =
      "No se pudo cambiar la linterna: " + error.message;
  }
}
